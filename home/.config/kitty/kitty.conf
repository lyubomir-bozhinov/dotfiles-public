font_family      Hack Nerd Font Mono
font_size        12

# 1.0 = no extra macOS stroke thickening (better for dark themes).
text_composition_strategy 1.0

focus_follows_mouse yes
macos_quit_when_last_window_closed yes
shell_integration enabled

# Close protection: confirm before closing a window or tab with a running process.
confirm_os_window_close -1
map cmd+q         no_op
map cmd+shift+w   no_op
map ctrl+shift+q  no_op
map ctrl+shift+w  no_op
map cmd+w         close_tab

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Tokyo Night
include theme.conf

tab_bar_edge          bottom
tab_bar_style         fade
tab_fade              1
tab_bar_margin_height 0.0 0.0
tab_title_template    "{index}:{title[:14]}"

# Title bar hidden, traffic lights kept. Drag the window by the top margin.
hide_window_decorations titlebar-only
window_margin_width     10 0 0 0
placement_strategy      top-left
window_padding_width    8
